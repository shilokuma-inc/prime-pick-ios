name: Verify/App Store metadata

# App Store の説明文などは、文字数の上限を超えていると App Store Connect への反映時に弾かれる。
# 反映（Metadata/App Store）の前に、PR の時点で欠損と文字数超過を機械的に落とす。
# あわせて、スクリーンショットの撮影設定（枚数の上限など）も読めるか確かめる。
# JSON を読むだけなので macOS ランナーもビルドも必要ない。

on:
  pull_request:
    paths:
      - 'AppStore/**'
      - 'Tools/**'
      # scene 名の突き合わせ元（ScreenshotDemo.Scene）が変わったときも検査する
      - 'PrimePickApp/Screenshot/ScreenshotDemo.swift'
      - 'PrimePickApp.xcodeproj/project.pbxproj'
      - '.github/workflows/verify-app-store-metadata.yml'

jobs:
  verify:
    name: metadata
    runs-on: ubuntu-latest

    # PR のコード（Python スクリプト）をそのまま実行するので、トークンは読み取りだけにし、checkout 後の .git/config にも残さない
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify App Store metadata
        run: python3 Tools/upload_metadata.py --check

      - name: Verify screenshot config
        run: |
          set -euo pipefail
          python3 Tools/app_store_config.py bundle-id
          python3 Tools/app_store_config.py scenes
          python3 Tools/app_store_config.py display-types
