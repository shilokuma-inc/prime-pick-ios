name: Build

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!develop'
      # assets/** は PR 用スクリーンショットの置き場でアプリのコードを含まないため除外する
      - '!assets/**'

# 同じブランチへの連続 push では古い実行をキャンセルする
concurrency:
  group: build-working-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-latest

    env:
      PROJECT: PrimePickApp.xcodeproj
      SCHEME: PrimePickApp

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4

      - name: ci_post_clone
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project "$PROJECT" -scheme "$SCHEME" -destination "generic/platform=iOS Simulator"
