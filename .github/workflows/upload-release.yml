name: Upload/release

on:
  push:
    branches:
      - 'release/**'

jobs:
  build:
    name: Upload/release
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4

      - name: ci_post_clone
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Create Private Key
        run: |
          mkdir private_keys
          echo -n '${{ secrets.APPLE_API_KEY_BASE64 }}' | base64 --decode > ./private_keys/AuthKey_${{ secrets.APPLE_API_ISSUER_ID }}.p8

      - name: Install Distribution Certificate
        env:
          DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.DISTRIBUTION_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          echo -n "$DISTRIBUTION_CERT_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          # 一時キーチェーンを作成し、配信用証明書を取り込む
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::PROVISIONING_PROFILE_BASE64 が空です。Organization Secrets の参照設定を確認してください"
            exit 1
          fi

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          # Xcode 16 以降は UserData 配下を参照するため、新旧どちらの場所にも配置する
          LEGACY_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          CURRENT_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$LEGACY_DIR" "$CURRENT_DIR"

          # ファイル名を UUID にしないと Xcode がプロファイルを解決できない
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" "$LEGACY_DIR/$PROFILE_UUID.mobileprovision"
          cp "$PROFILE_PATH" "$CURRENT_DIR/$PROFILE_UUID.mobileprovision"

          echo "installed provisioning profile: $PROFILE_UUID"

      - name: Archive Project
        env:
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail

          if [ -z "$PROVISIONING_PROFILE_NAME" ]; then
            echo "::error::PROVISIONING_PROFILE_NAME が空です。Organization Secrets の参照設定を確認してください"
            exit 1
          fi

          # 署名は取り込み済みの証明書とプロファイルで固定し、自動生成を行わせない
          xcodebuild archive \
            -project PrimePickApp.xcodeproj \
            -scheme PrimePickApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath PrimePickApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME"

      - name: Create ExportOptions.plist
        run: |
          echo '${{ secrets.EXPORT_OPTIONS }}' > ExportOptions.plist

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath PrimePickApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath app.ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${{ secrets.APPLE_API_ISSUER_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APPLE_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPLE_API_ISSUER_ID }}"

      - name: Upload IPA to App Store Connect
        run: |
          xcrun altool --upload-app -f app.ipa/PrimePickApp.ipa \
                       -u ${{ secrets.APPLE_ID }} \
                       -p ${{ secrets.APP_SPECIFIC_PASSWORD }} \
                       --type ios

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimePickApp-ipa
          path: app.ipa/PrimePickApp.ipa

      - name: Clean Up Keychain
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
