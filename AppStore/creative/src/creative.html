<!doctype html>
<!--
  App Store のクリエイティブアセット（プロダクトページのヘッダー / 検索結果）の元。
  Tools/render_creative_assets.sh が Chrome で開いて実寸で書き出す。直接開くときは
  creative.html?type=header&lang=ja&screens=01_home のように指定する
  （同じフォルダの screens/<言語>/ に 6.9 inch のスクリーンショット、icon.png にアプリアイコンが要る）。

  Prime Pick 用（#441）。色はホームの背景（淡いミントから水色）とタイトルのロゴのタイルの文字色、
  見出しの書体はアプリの見出し（AppFont: Didot Bold ＋ ヒラギノ明朝 W6）に合わせた。
  TODO: が残っているあいだは Tools/upload_creative_assets.py が反映を止める。

  方針（https://developer.apple.com/app-store/asset-best-practices/）
  - ヘッダー（21:9）: 初めて来た人向けに、アプリのいちばんの価値を 1 つだけ伝える。
    端末によって左右が切れるので、文言と端末は中央に寄せる。
  - 検索結果（3:2）: 何をするアプリかが一目でわかるよう、実際の画面と主な機能を見せる。
  - 他社のロゴ・価格・URL・受賞歴は入れない。文言は短く、言語ごとに訳す。
-->
<html>
<head>
<meta charset="utf-8">
<style>
  /* ホームの背景（ミント → 水色）と、タイトルのロゴの文字色（P の橙・C の青緑） */
  :root {
    --background: #d9f6ec;
    --background-2: #c3ebf6;
    --highlight: #f26a1b;
    --accent: #10a59a;
    --text: #23313a;
    --text-2: rgba(35, 49, 58, 0.72);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  /* 本文の書体（--sans）と、見出しで Didot に組み合わせる書体（--heading）を言語ごとに決める。
     アプリは日本語のときだけ和文の書体（ヒラギノ明朝）を組み合わせ、中国語・韓国語は端末の書体
     （PingFang・Apple SD Gothic Neo）に落ちる（AppFont.cascadesJapanese）ので、ここも合わせる */
  body { --sans: "SF Pro Display"; --heading: "Didot"; }
  body[data-lang="ja"] { --sans: "Hiragino Sans"; --heading: "Hiragino Mincho ProN"; }
  body[data-lang="zh-Hans"] { --sans: "PingFang SC"; --heading: "PingFang SC"; }
  body[data-lang="zh-Hant"] { --sans: "PingFang TC"; --heading: "PingFang TC"; }
  body[data-lang="ko"] { --sans: "Apple SD Gothic Neo"; --heading: "Apple SD Gothic Neo"; }
  body {
    background: var(--background);
    color: var(--text);
    font-family: var(--sans), "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* 見出しはアプリの見出しと同じ書体（数字・英字は Didot） */
  .headline, .copy .title, .brand { font-family: "Didot", var(--heading), serif; }

  .canvas { position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background:
      radial-gradient(ellipse 60% 70% at 50% 100%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
      radial-gradient(ellipse 90% 80% at 50% 0%, var(--background-2), var(--background) 75%); }

  /* box-shadow の大きなぼかしは Chrome で四角い継ぎ目が出るので、光はグラデーションで描く */
  .glow { position: absolute; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--highlight) 32%, transparent) 0%, transparent 70%); }

  /* 端末は 6.9 inch の iPhone に似せる。寸法は端末の幅から JavaScript（phone）で決める。
     padding の % は親（画面全体）の幅に対する割合になり、枠が太くなるので使わない */
  .phone { position: absolute;
    /* チタンのフレーム。斜めの光と、縁の細いハイライト */
    background: linear-gradient(135deg, #6b6e78 0%, #33353c 18%, #1b1c21 46%, #2c2e35 70%, #5c5f69 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22), 0 0 0 1px rgba(0, 0, 0, 0.55); }
  .phone .bezel { background: #000; }
  .phone img { display: block; width: 100%; }
  /* 側面のボタン（左: アクションボタン・音量、右: サイドボタン）。フレームの外に少しだけ出す */
  .phone .button { position: absolute;
    background: linear-gradient(90deg, #2a2c32, #6a6d77 45%, #3a3c43); }

  .headline { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; letter-spacing: -0.01em; }
  .headline em, .copy .title em { font-style: normal; color: var(--highlight); }
  .sub { position: absolute; left: 0; right: 0; text-align: center; color: var(--text-2); font-weight: 500; }

  .copy { position: absolute; }
  .copy .title { font-weight: 800; line-height: 1.18; letter-spacing: -0.01em; }
  .chips { display: flex; flex-direction: column; gap: 0.55em; }
  .chip { display: inline-flex; align-items: center; gap: 0.6em; align-self: flex-start;
    padding: 0.45em 0.95em 0.5em 0.7em; border-radius: 999px; font-weight: 700;
    background: color-mix(in srgb, var(--accent) 14%, white);
    box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--accent) 70%, white 10%); }
  .chip i { font-style: normal; display: grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%;
    background: var(--accent); color: #ffffff; font-size: 0.8em; }
  .brand { position: absolute; display: flex; align-items: center; gap: 0.6em; font-weight: 800; color: var(--text); }
  .brand img { height: 1.9em; border-radius: 22%; }
</style>
</head>
<body>
<div class="canvas" id="canvas"></div>
<script>
  const params = new URLSearchParams(location.search);
  const type = params.get("type") || "header";
  const lang = params.get("lang") || "ja";
  const appName = params.get("name") || "App";
  // 6.9 inch のスクリーンショットのファイル名（拡張子なし）。先頭が真ん中の端末に載る
  const screens = (params.get("screens") || "").split(",").filter(Boolean);
  document.body.dataset.lang = lang;

  // <em> で囲んだところが強調色になる。言語は AppStore/languages.json と同じ（キーは language）
  const copy = {
    ja: {
      header: { title: "その数、<em>素数</em>？", sub: "「素数」か「ちがう」か。2 択で答えて、数に強くなる。" },
      search: { title: "素数か、<br><em>ちがう</em>か。", chips: ["15〜60 秒のタイムアタック", "1 日 1 回の今日のチャレンジ", "間違えた数は素因数分解で復習"] },
    },
    en: {
      header: { title: "Is it <em>prime</em>?", sub: "Tap PRIME or NOT PRIME, and sharpen your number sense." },
      search: { title: "Prime,<br>or <em>not</em>?", chips: ["15–60 second Time Attack", "A new Daily Challenge every day", "Review misses, factor by factor"] },
    },
    "zh-Hans": {
      header: { title: "这个数，是<em>质数</em>吗？", sub: "“质数”还是“不是”？二选一作答，越玩数感越强。" },
      search: { title: "是质数，<br>还是<em>不是</em>？", chips: ["15～60 秒限时挑战", "每天 10 题的每日挑战", "答错的数用分解质因数复习"] },
    },
    "zh-Hant": {
      header: { title: "這個數，是<em>質數</em>嗎？", sub: "「質數」還是「不是」？二選一作答，越玩越有數感。" },
      search: { title: "是質數，<br>還是<em>不是</em>？", chips: ["15～60 秒限時挑戰", "每天 10 題的每日挑戰", "答錯的數用質因數分解複習"] },
    },
    ko: {
      header: { title: "이 수, <em>소수</em>일까?", sub: "두 버튼 중 하나로 답하고, 수 감각을 키우세요." },
      search: { title: "소수냐,<br><em>아니냐</em>.", chips: ["15~60초 타임어택", "하루 한 번 오늘의 챌린지", "틀린 수는 소인수분해로 복습"] },
    },
    es: {
      header: { title: "¿Este número es <em>primo</em>?", sub: "¿Primo o no? Responde con un toque y domina los números." },
      search: { title: "¿Primo<br>o <em>no</em>?", chips: ["Contrarreloj de 15, 30 y 60 s", "Un Reto del día nuevo cada día", "Repasa errores con factorización"] },
    },
    fr: {
      header: { title: "Est-il <em>premier</em> ?", sub: "Premier ou pas ? Répondez d’un geste et progressez en calcul." },
      search: { title: "Premier<br>ou <em>pas</em> ?", chips: ["Contre-la-montre de 15 à 60 s", "Un nouveau défi chaque jour", "Vos erreurs en facteurs premiers"] },
    },
    de: {
      header: { title: "Ist die Zahl <em>prim</em>?", sub: "Prim oder nicht? Ein Fingertipp – und dein Zahlengefühl wächst." },
      search: { title: "Prim –<br>oder <em>nicht</em>?", chips: ["Blitzrunde: 15, 30 oder 60 Sek.", "Jeden Tag ein neues Tagesquiz", "Fehler mit Primfaktoren erklärt"] },
    },
    it: {
      header: { title: "È <em>primo</em>?", sub: "Primo o no? Rispondi con un tocco e diventa un asso dei numeri." },
      search: { title: "Primo<br>o <em>no</em>?", chips: ["Contro il tempo: 15, 30 o 60 s", "Una nuova sfida ogni giorno", "Ripassa con i fattori primi"] },
    },
    "pt-BR": {
      header: { title: "Esse número é <em>primo</em>?", sub: "Primo ou não? Responda com um toque e fique craque em números." },
      search: { title: "Primo<br>ou <em>não</em>?", chips: ["Contra o Tempo de 15, 30 e 60 s", "Um Desafio do dia novo todo dia", "Revise erros com fatores primos"] },
    },
  }[lang];
  // 文言の無い言語は、背景だけの画像を書き出さないようここで止める（render_creative_assets.sh でも先に確かめる）
  if (!copy || screens.length === 0) {
    document.body.innerHTML = `<h1 style="color:red;font-size:200px">No copy or screens for "${lang}"</h1>`;
    throw new Error(`creative.html に ${lang} の文言か画面がありません`);
  }

  const canvas = document.getElementById("canvas");
  const W = innerWidth;
  const add = (html) => { canvas.insertAdjacentHTML("beforeend", html); return canvas.lastElementChild; };
  // 画面が足りないときは、ある画面を繰り返して使う
  const screen = (index) => screens[index % screens.length];
  // 端末の寸法（端末の幅に対する割合）。6.9 inch の iPhone の実物に合わせる:
  // 幅 77.6mm に対して、画面のまわりは片側 2.1mm ほど（黒い縁 1.3mm・フレーム 0.9mm）
  const FRAME = 0.0115;
  const BEZEL = 0.0165;
  // 画面の角の丸み（画面の幅に対する割合）。6.9 inch の画面（440pt）の角は 62pt
  const SCREEN_RADIUS = 62 / 440;
  // 側面のボタン: [左か右, 上端（端末の高さに対する割合）, 長さ]
  const BUTTONS = [["left", 0.185, 0.04], ["left", 0.255, 0.065], ["left", 0.34, 0.065], ["right", 0.27, 0.105]];
  const phone = (index, x, y, width, rotate = 0, z = 1) => {
    const frame = width * FRAME;
    const bezel = width * BEZEL;
    const screenRadius = (width - 2 * (frame + bezel)) * SCREEN_RADIUS;
    // 角は画面と同心にする
    const bezelRadius = screenRadius + bezel;
    const outerRadius = bezelRadius + frame;
    const thickness = Math.max(2, width * 0.0065);
    const buttons = BUTTONS.map(([side, top, length]) =>
      `<i class="button" style="${side}:${-thickness}px;top:${top * 100}%;height:${length * 100}%;width:${thickness + frame / 2}px;` +
      `border-radius:${side === "left" ? `${thickness}px 0 0 ${thickness}px` : `0 ${thickness}px ${thickness}px 0`}"></i>`).join("");
    return add(
      `<div class="phone" style="left:${x - width / 2}px;top:${y}px;width:${width}px;padding:${frame}px;border-radius:${outerRadius}px;` +
      `transform:rotate(${rotate}deg);z-index:${z};filter:drop-shadow(0 ${width * 0.09}px ${width * 0.11}px rgba(0, 0, 0, 0.55))">` +
      buttons +
      `<div class="bezel" style="padding:${bezel}px;border-radius:${bezelRadius}px">` +
      `<img src="screens/${lang}/${screen(index)}.png" style="border-radius:${screenRadius}px"></div></div>`);
  };
  const glow = (size, x, y) => add(`<div class="glow" style="width:${size}px;height:${size}px;left:${x - size / 2}px;top:${y - size / 2}px"></div>`);

  if (type === "header") {
    // 21:9（3840x1646）。中央に寄せる（左右は端末によって切れる）
    glow(2200, W / 2, 1300);
    const title = add(`<div class="headline" style="top:150px;font-size:128px">${copy.header.title}</div>`);
    add(`<div class="sub" style="top:${150 + title.offsetHeight + 34}px;font-size:58px">${copy.header.sub}</div>`);
    if (screens.length > 1) {
      phone(1, W / 2 - 700, 690, 560, -7, 1);
      phone(2, W / 2 + 700, 690, 560, 7, 1);
    }
    phone(0, W / 2, 560, 640, 0, 2);
  } else {
    // 3:2（3840x2560）。左に何のアプリかと主な機能、右に実際の画面
    glow(2600, W - 1000, 1400);
    add(`<div class="brand" style="left:250px;top:200px;font-size:86px"><img src="icon.png">${appName}</div>`);
    add(`<div class="copy" style="left:250px;top:470px;width:1700px;font-size:150px">` +
        `<div class="title">${copy.search.title}</div>` +
        `<div class="chips" style="font-size:78px;margin-top:110px">` +
        copy.search.chips.map((c, i) => `<div class="chip"><i>${i + 1}</i>${c}</div>`).join("") +
        `</div></div>`);
    if (screens.length > 1) {
      phone(1, W - 1700, 520, 860, -6, 1);
    }
    phone(0, W - 900, 360, 980, 4, 2);
  }
</script>
</body>
</html>
